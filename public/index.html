<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI API Health & Alert Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex justify-between items-center mb-8 border-b pb-4">
      <div>
        <h1 class="text-3xl font-bold text-blue-600">AI API Monitor & Alert System</h1>
        <p class="text-sm text-gray-500">Real-time anomaly detection and LLM-powered incident alerts</p>
      </div>
      <button onclick="fetchAlerts()" class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition">
        ↻ Refresh Alerts
      </button>
    </header>

    <!-- Stats bar -->
    <div id="stats-bar" class="hidden flex gap-4 mb-6">
      <div class="bg-white rounded-lg border shadow-sm px-5 py-3 flex flex-col items-center">
        <span id="stat-total" class="text-2xl font-bold text-red-600">0</span>
        <span class="text-xs text-gray-500 mt-1">Active Alerts</span>
      </div>
    </div>

    <!-- Error banner -->
    <div id="error-banner" class="hidden bg-red-50 border border-red-300 text-red-700 rounded-lg p-4 mb-6 flex items-center gap-3">
      <span class="text-xl">⚠️</span>
      <div>
        <p class="font-semibold">Could not connect to the server.</p>
        <p class="text-sm">Make sure the backend is running, then click <strong>Refresh Alerts</strong>.</p>
      </div>
    </div>

    <!-- Alerts Container -->
    <main>
      <h2 class="text-xl font-semibold mb-4">Active System Anomalies</h2>
      <div id="alerts-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Dynamically injected alert cards -->
      </div>
    </main>
  </div>

  <script>
    // Badge colour map per anomaly type (Fix #3)
    const BADGE_STYLES = {
      HIGH_LATENCY:  'bg-yellow-100 text-yellow-800 border-yellow-300',
      SERVER_ERROR:  'bg-red-100    text-red-800    border-red-300',
      ZERO_RECORDS:  'bg-orange-100 text-orange-800 border-orange-300',
    };

    function buildBadge(type) {
      const style = BADGE_STYLES[type] || 'bg-gray-100 text-gray-700 border-gray-300';
      return `<span class="text-xs font-semibold px-2 py-0.5 rounded border ${style}">${type.replace('_', ' ')}</span>`;
    }

    async function resolveAlert(id, btn) {
      try {
        btn.disabled = true;
        btn.textContent = 'Resolving…';
        const res = await fetch(`/alerts/${id}/resolve`, { method: 'PATCH' });
        if (res.ok) {
          // Remove the card from the UI immediately
          const card = document.getElementById(`card-${id}`);
          if (card) card.remove();
          updateStatsBar();
        } else {
          btn.disabled = false;
          btn.textContent = '✓ Resolve';
          alert('Failed to resolve alert. Please try again.');
        }
      } catch (err) {
        console.error('Resolve error:', err);
        btn.disabled = false;
        btn.textContent = '✓ Resolve';
      }
    }

    function updateStatsBar() {
      const cards = document.querySelectorAll('[id^="card-"]');
      const total = cards.length;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stats-bar').classList.toggle('hidden', total === 0);
    }

    async function fetchAlerts() {
      const container = document.getElementById('alerts-list');
      const errorBanner = document.getElementById('error-banner');

      errorBanner.classList.add('hidden');

      try {
        const res = await fetch('/alerts');
        if (!res.ok) throw new Error(`Server responded with ${res.status}`);

        const alerts = await res.json();
        container.innerHTML = '';

        if (alerts.length === 0) {
          document.getElementById('stats-bar').classList.add('hidden');
          container.innerHTML = `
            <div class="col-span-2 bg-white border rounded-lg p-8 text-center shadow-sm">
              <p class="text-4xl mb-3">✅</p>
              <p class="text-gray-600 font-medium">No active anomalies detected. All systems healthy!</p>
            </div>`;
          return;
        }

        alerts.forEach(alert => {
          const card = document.createElement('div');
          card.id = `card-${alert._id}`;
          card.className = 'bg-white border-l-4 border-red-500 p-5 rounded-lg shadow-sm flex flex-col justify-between';

          // Build anomaly-type badges (Fix #3)
          const badges = (alert.anomaly_types || []).map(buildBadge).join(' ');

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="font-bold text-lg text-gray-800">${alert.api_name}</span>
                <span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-semibold">HTTP ${alert.status_code}</span>
              </div>

              <!-- Anomaly type badges (Fix #3) -->
              <div class="flex flex-wrap gap-1 mb-3">${badges}</div>

              <!-- AI-generated alert text -->
              <p class="text-gray-700 font-medium my-2 bg-gray-50 p-3 rounded border">${alert.ai_alert}</p>

              <div class="text-xs text-gray-500 space-x-4 mt-2">
                <span>Response Time: <strong>${alert.response_time_ms} ms</strong></span>
                <span>Records: <strong>${alert.records_returned}</strong></span>
              </div>
            </div>

            <div class="flex justify-between items-center mt-4">
              <span class="text-xs text-gray-400">${new Date(alert.timestamp).toLocaleString()}</span>
              <!-- Resolve button (Fix #4) -->
              <button
                onclick="resolveAlert('${alert._id}', this)"
                class="text-xs bg-green-50 text-green-700 border border-green-300 px-3 py-1 rounded hover:bg-green-100 transition font-semibold">
                ✓ Resolve
              </button>
            </div>
          `;
          container.appendChild(card);
        });

        updateStatsBar();

      } catch (err) {
        console.error('Error fetching alerts:', err);
        errorBanner.classList.remove('hidden'); // Fix #8 — show error state to user
        container.innerHTML = '';
        document.getElementById('stats-bar').classList.add('hidden');
      }
    }

    // Load alerts on page load and auto-refresh every 15 seconds
    fetchAlerts();
    setInterval(fetchAlerts, 15000);
  </script>
</body>
</html>
